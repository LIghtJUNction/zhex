[package]
name = "zhex"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"
description = "Zero-dependency, no_std hexadecimal encoding and decoding into caller-owned buffers"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zhex"
readme = "README.md"
keywords = ["hex", "hexadecimal", "no-std", "encoding", "simd"]
categories = ["encoding", "no-std", "no-std::no-alloc"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[features]
default = []
force-scalar = []

[workspace]
members = ["."]
exclude = ["comparison"]
resolver = "3"
