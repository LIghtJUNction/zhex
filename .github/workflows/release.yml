name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
      expected_sha:
        description: Optional exact commit expected at the tag
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Immutable release tag created by the version workflow
        required: true
        type: string
      expected_sha:
        description: Exact commit created by the version workflow
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: zhex-release
  cancel-in-progress: false

jobs:
  resolve:
    # workflow_call keeps its caller's event. Never accept a PR/fork context.
    if: >-
      github.repository == 'LIghtJUNction/zhex' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/tags/v') ||
         (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          inputs.tag != '' && inputs.expected_sha != ''))))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag and check manifest version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.sha) || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -B scripts/resolve-release.py "$RELEASE_TAG" --expected-sha "$EXPECTED_SHA" \
            --trusted-ref "refs/remotes/origin/$DEFAULT_BRANCH"

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Verify the tag still names the checked commit
        run: |
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 -B scripts/resolve-release.py "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" \
            --trusted-ref "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Missing CARGO_REGISTRY_TOKEN repository secret.'
            exit 1
          fi
          cargo +stable publish --locked

  github-release:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create release after successful crates.io publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 -B scripts/resolve-release.py "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" \
            --trusted-ref "refs/remotes/origin/$DEFAULT_BRANCH"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$RELEASE_SHA" --title "zhex $RELEASE_TAG" --generate-notes

