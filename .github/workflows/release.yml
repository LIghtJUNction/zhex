name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zhex-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'LIghtJUNction/zhex'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag and check manifest version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/resolve-release.py "$RELEASE_TAG"

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Verify the tag still names the checked commit
        run: |
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 scripts/resolve-release.py "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Missing CARGO_REGISTRY_TOKEN repository secret.'
            exit 1
          fi
          cargo +stable publish --locked

  github-release:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create release after successful crates.io publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 scripts/resolve-release.py "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$RELEASE_SHA" --title "zhex $RELEASE_TAG" --generate-notes

